name: eduquizai

services:
  # Chaque service ne reçoit que les variables dont il a besoin (moindre
  # privilège) : un nom seul reprend la valeur du fichier .env, sans la
  # recopier ici. Ainsi, ia ne connaît ni les mots de passe des bases ni la
  # clé de Django, et web ne connaît ni le compte root MongoDB ni la clé Mistral.
  web:
    build: ./web
    environment:
      - DJANGO_SECRET_KEY
      - DJANGO_DEBUG
      - DJANGO_ALLOWED_HOSTS
      - DJANGO_EMAIL_BACKEND
      - DJANGO_DEFAULT_FROM_EMAIL
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST=postgres     # dans Docker, on joint la base par le nom de son service
      - POSTGRES_PORT
      - MONGO_DB
      - MONGO_APP_USER
      - MONGO_APP_PASSWORD
      - MONGO_HOST=mongo
      - MONGO_PORT
      - IA_URL
      - IA_JWT_SECRET
      - IA_JWT_DUREE
      - IA_DELAI
      - IA_FOURNISSEUR
    volumes:
      - ./web:/app                 # le code est partagé : une modification est prise en compte sans reconstruire
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  ia:
    build: ./ia
    environment:
      - IA_SECRET_KEY
      - IA_DEBUG
      - IA_ALLOWED_HOSTS
      - IA_JWT_SECRET
      - IA_FOURNISSEUR
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODELE
      - OLLAMA_DELAI
      - MISTRAL_URL
      - MISTRAL_API_KEY
      - MISTRAL_MODELE
      - MISTRAL_DELAI
    volumes:
      - ./ia:/app
    # Aucun port publié : seul le conteneur web joint le microservice,
    # par le réseau interne de Docker (http://ia:8000)
    depends_on:
      - ollama

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  mongo:
    image: mongo:8
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
      # Pour le script de création du compte applicatif (initdb)
      - MONGO_DB
      - MONGO_APP_USER
      - MONGO_APP_PASSWORD
    volumes:
      - mongo_data:/data/db
      # Création du compte applicatif au premier démarrage (lecture seule)
      - ./docker/mongo/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  mongo_data:
  ollama_data:
    external: true   # volume existant qui contient déjà llama3.2:3b
