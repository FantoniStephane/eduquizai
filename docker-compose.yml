name: eduquizai

services:
  web:
    build: ./web
    env_file: .env
    environment:
      POSTGRES_HOST: postgres      # dans Docker, on joint la base par le nom de son service
      MONGO_HOST: mongo
    volumes:
      - ./web:/app                 # le code est partagé : une modification est prise en compte sans reconstruire
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  ia:
    build: ./ia
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./ia:/app
    # Aucun port publié : seul le conteneur web joint le microservice,
    # par le réseau interne de Docker (http://ia:8000)
    depends_on:
      - ollama

  postgres:
    image: postgres:17
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  mongo:
    image: mongo:8
    env_file: .env
    volumes:
      - mongo_data:/data/db
      # Création du compte applicatif au premier démarrage (lecture seule)
      - ./docker/mongo/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  mongo_data:
  ollama_data:
    external: true   # volume existant qui contient déjà llama3.2:3b
