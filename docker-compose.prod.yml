# Déploiement en production (serveur VPS avec Coolify).
#
# Différences avec docker-compose.yml (développement) :
# - pas d'Ollama : le serveur n'a pas de carte graphique, l'IA passe par
#   l'API Mistral (fournisseur par défaut) ;
# - aucun port publié : seul Traefik, le proxy de Coolify, joint le service web
#   par le réseau de Docker, en HTTPS (certificat Let's Encrypt) ;
# - code copié dans les images (pas de dossier partagé), Gunicorn au lieu du
#   serveur de développement (DJANGO_PRODUCTION=True, voir lancement.sh) ;
# - redémarrage automatique des conteneurs ;
# - les secrets sont saisis dans Coolify (variables d'environnement), jamais
#   dans le dépôt.

services:
  web:
    build: ./web
    restart: unless-stopped
    environment:
      - DJANGO_PRODUCTION=True
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS}
      # E-mails (invitations, mot de passe oublié) : dans les journaux du
      # conteneur tant qu'aucun serveur SMTP n'est configuré
      - DJANGO_EMAIL_BACKEND=${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - DJANGO_DEFAULT_FROM_EMAIL=${DJANGO_DEFAULT_FROM_EMAIL:-EduQuizAI <no-reply@eduquizai.local>}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MONGO_DB=${MONGO_DB}
      - MONGO_APP_USER=${MONGO_APP_USER}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - IA_URL=http://ia:8000
      - IA_JWT_SECRET=${IA_JWT_SECRET}
      - IA_FOURNISSEUR=mistral
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      ia:
        condition: service_started

  ia:
    build: ./ia
    restart: unless-stopped
    environment:
      - DJANGO_PRODUCTION=True
      - IA_DEBUG=False
      - IA_SECRET_KEY=${IA_SECRET_KEY}
      - IA_ALLOWED_HOSTS=ia
      - IA_JWT_SECRET=${IA_JWT_SECRET}
      - IA_FOURNISSEUR=mistral
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_MODELE=${MISTRAL_MODELE:-ministral-3b-2512}

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_DB=${MONGO_DB}
      - MONGO_APP_USER=${MONGO_APP_USER}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
