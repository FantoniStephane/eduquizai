<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · EduQuizAI</title>
  <link rel="icon" href="assets/logo_icone.svg">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="page-connexion">
  <main class="connexion">
    <img class="logo" src="assets/logo.svg" alt="EduQuizAI by SchoolUp">
    <div class="carte">
      <h1>Connexion</h1>
      <p class="muted">Espace enseignant</p>
      <form method="post" action="#" novalidate>
        <div class="champ">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="prenom.nom@ecole.fr" required>
        </div>
        <div class="champ">
          <label for="mdp">Mot de passe</label>
          <input id="mdp" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primaire btn-bloc" type="submit">Se connecter</button>
      </form>
    </div>
    <p class="pied muted">Pas encore de compte ? Votre compte est créé par l'administrateur de votre établissement.</p>
  </main>
</body>
</html>
