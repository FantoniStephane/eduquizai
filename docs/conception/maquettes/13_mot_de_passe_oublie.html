<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mot de passe oublié · EduQuizAI</title>
  <link rel="icon" href="assets/logo_icone.svg">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="page-connexion">
  <main class="connexion">
    <img class="logo" src="assets/logo.svg" alt="EduQuizAI by SchoolUp">
    <div class="carte">
      <h1>Mot de passe oublié</h1>
      <p class="muted">Recevez un lien pour choisir un nouveau mot de passe</p>
      <form method="post" action="#" novalidate>
        <div class="champ">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="prenom.nom@ecole.fr" required>
        </div>
        <button class="btn btn-primaire btn-bloc" type="submit">Recevoir un lien</button>
      </form>
      <a class="lien-retour" href="01_connexion.html">Retour à la connexion</a>
    </div>
  </main>
</body>
</html>
